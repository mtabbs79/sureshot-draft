services:
  - type: web
    name: sureshot-draft
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sureshot-draft-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: sureshot-draft-db
    plan: free
    ipAllowList: []
